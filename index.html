    <script>
        // Dados padrão (baseado no HTML original)
        const defaultData = {
            featuredVideo: "jKoM0eKkJCo",
            suggestions: [
                { id: "jKoM0eKkJCo", title: "Como instalar a rom un1ca 3.0.6" },
                { id: "TjYQ1iUuMlA", title: "Como instalar a Clean UI 7 no S20fe" },
                { id: "2588HbuLrtA", title: "Como instalar a Polsar OS One Ui 5.1 no S20fe" },
                { id: "_E906DAWdpw", title: "Super Wallpaper animado xiaomi na tela Aod Samsung - root" },
                { id: "jdjfZh-ZXq8", title: "Swifyt Blackup - Restauração de Whatsapp" },
                { id: "ZsF7gaMhMvw", title: "Como instalar Stock em qualquer Samsung" },
                { id: "giJXYqCZShU", title: "Como desbloquear o bootloader do Celular Samsung" },
                { id: "GlNHDZpT5UU", title: "Como instalar a Stock rom sem Computador" },
                { id: "JlKrPbHpijU", title: "Como instalar o Twrp eo Vb meta sem pc - Eros Flash toot" }
            ],
            downloads: [
                { name: "📦 Pulsar OS", link: "https://drive.google.com/drive/folders/1ZtlcC-Mdop1rdt6H27vPiUEM7daKf2Tj" },
                { name: "📦 Mist OS", link: "https://drive.google.com/drive/folders/1MGQy1z_xjzD6nWI0jYPfeVFChtQwoSS5" }
            ],
            social: {
                tiktok: "https://www.tiktok.com/@pandaansioso",
                telegramGrupo: "https://t.me/r8q_BR",
                telegramPerfil: "https://t.me/PANDA_ANSIOSO"
            }
        };

        // Carregar dados salvos ou usar padrão
        let appData = JSON.parse(localStorage.getItem('pandaAnsiosoData')) || defaultData;

        function saveToLocalStorage() {
            localStorage.setItem('pandaAnsiosoData', JSON.stringify(appData));
        }

        function renderAdminPanel() {
            document.getElementById('admin-featured-video').value = appData.featuredVideo;
            
            // Sugestões
            const container = document.getElementById('admin-suggestions-list');
            container.innerHTML = '';
            appData.suggestions.forEach((sug, index) => {
                const div = document.createElement('div');
                div.className = 'sug-item';
                div.innerHTML = `
                    <input type="text" placeholder="ID do YouTube" value="${sug.id}" data-sug-id="${index}" class="sug-id">
                    <input type="text" placeholder="Título" value="${sug.title.replace(/"/g, '&quot;')}" data-sug-title="${index}" style="margin-top:5px">
                    <button onclick="removeSuggestion(${index})">Remover</button>
                `;
                container.appendChild(div);
            });
            
            document.getElementById('admin-download1-name').value = appData.downloads[0].name;
            document.getElementById('admin-download1-link').value = appData.downloads[0].link;
            document.getElementById('admin-download2-name').value = appData.downloads[1].name;
            document.getElementById('admin-download2-link').value = appData.downloads[1].link;
            document.getElementById('admin-social-tiktok').value = appData.social.tiktok;
            document.getElementById('admin-social-telegram-grupo').value = appData.social.telegramGrupo;
            document.getElementById('admin-social-telegram-perfil').value = appData.social.telegramPerfil;
        }

        function saveAllData() {
            // Salvar vídeo em destaque
            appData.featuredVideo = document.getElementById('admin-featured-video').value;
            
            // Salvar sugestões
            const newSuggestions = [];
            const sugIds = document.querySelectorAll('.sug-id');
            const sugTitles = document.querySelectorAll('[data-sug-title]');
            for (let i = 0; i < sugIds.length; i++) {
                if (sugIds[i] && sugTitles[i]) {
                    newSuggestions.push({
                        id: sugIds[i].value,
                        title: sugTitles[i].value
                    });
                }
            }
            appData.suggestions = newSuggestions;
            
            // Salvar downloads
            appData.downloads[0].name = document.getElementById('admin-download1-name').value;
            appData.downloads[0].link = document.getElementById('admin-download1-link').value;
            appData.downloads[1].name = document.getElementById('admin-download2-name').value;
            appData.downloads[1].link = document.getElementById('admin-download2-link').value;
            
            // Salvar redes sociais
            appData.social.tiktok = document.getElementById('admin-social-tiktok').value;
            appData.social.telegramGrupo = document.getElementById('admin-social-telegram-grupo').value;
            appData.social.telegramPerfil = document.getElementById('admin-social-telegram-perfil').value;
            
            saveToLocalStorage();
            renderFrontend();
            alert('✅ Todas as informações foram salvas!');
        }

        function renderFrontend() {
            // Vídeo em destaque
            document.getElementById('random-video').src = "https://www.youtube.com/embed/" + appData.featuredVideo;
            
            // Sugestões
            const list = document.getElementById('suggestions-list');
            const btnToggle = document.getElementById('btn-toggle');
            // Limpar exceto o botão
            while (list.firstChild && list.lastChild !== btnToggle) {
                if (list.firstChild !== btnToggle) list.removeChild(list.firstChild);
            }
            
            appData.suggestions.forEach((video, index) => {
                const a = document.createElement("a");
                a.href = `https://youtu.be/${video.id}`;
                a.target = "_blank";
                a.className = index < 3 ? "sug-card show" : "sug-card";
                a.innerHTML = `<img src="https://img.youtube.com/vi/${video.id}/mqdefault.jpg" alt="${video.title}"><span>${video.title}</span>`;
                list.insertBefore(a, btnToggle);
            });
            
            // Downloads
            document.getElementById('download1-name').innerText = appData.downloads[0].name;
            const btn1 = document.querySelector('.download-item:first-child .btn-download');
            if (btn1) btn1.setAttribute('data-link', appData.downloads[0].link);
            
            document.getElementById('download2-name').innerText = appData.downloads[1].name;
            const btn2 = document.querySelectorAll('.download-item')[1]?.querySelector('.btn-download');
            if (btn2) btn2.setAttribute('data-link', appData.downloads[1].link);
            
            // Redes sociais
            document.getElementById('social-tiktok').href = appData.social.tiktok;
            document.getElementById('social-telegram-grupo').href = appData.social.telegramGrupo;
            document.getElementById('social-telegram-perfil').href = appData.social.telegramPerfil;
        }

        function addSuggestionField() {
            appData.suggestions.push({ id: "novo_id", title: "Novo vídeo" });
            renderAdminPanel();
        }

        function removeSuggestion(index) {
            appData.suggestions.splice(index, 1);
            renderAdminPanel();
        }

        function toggleAdmin() {
            const panel = document.getElementById('admin-panel');
            panel.classList.toggle('show');
            if (panel.classList.contains('show')) {
                renderAdminPanel();
            }
        }

        // Funções originais adaptadas
        function toggleView() {
            const cards = document.querySelectorAll('.sug-card');
            const btn = document.getElementById('btn-toggle');
            const isExpanding = btn.innerText === "VER MAIS";
            cards.forEach((item, index) => {
                if (isExpanding) { item.classList.add('show'); }
                else { if (index < 3) { item.classList.add('show'); } else { item.classList.remove('show'); } }
            });
            btn.innerText = isExpanding ? "VER MENOS" : "VER MAIS";
        }
        
        function startDownload(btn, finalLink) {
            if (!finalLink) {
                alert("Link de download não configurado! Use o botão Admin para configurar.");
                return;
            }
            const hasBeenClicked = btn.getAttribute('data-clicked') === 'true';
            const adLink = 'https://collshp.com/pandaansioso497?view=storefront';

            if (!hasBeenClicked) {
                window.open(adLink, '_blank');
                btn.setAttribute('data-clicked', 'true');
                btn.classList.add('ready');
                btn.innerText = "▶️ INICIAR DOWNLOAD";
            } else {
                const container = btn.nextElementSibling;
                const bar = container.querySelector('.progress-bar');
                container.style.display = "block";
                btn.disabled = true;
                let count = 5;
                btn.innerText = "Aguarde " + count + "s...";
                setTimeout(() => { bar.style.width = "20%"; }, 50);
                let interval = setInterval(() => {
                    count--;
                    btn.innerText = "Aguarde " + count + "s...";
                    bar.style.width = ((5 - count + 1) * 20) + "%";
                    if (count <= 0) { clearInterval(interval); window.location.href = finalLink; }
                }, 1000);
            }
        }

        // Inicializar
        document.addEventListener("DOMContentLoaded", function() {
            renderFrontend();
            document.getElementById("device-indicator").innerText = "Acessando via: " + (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ? "Celular" : "Computador");
            // Garantir que os botões de download tenham data-link
            document.querySelectorAll('.btn-download').forEach(btn => {
                if (!btn.getAttribute('data-link')) {
                    btn.setAttribute('data-link', '');
                }
            });
        });
    </script>
